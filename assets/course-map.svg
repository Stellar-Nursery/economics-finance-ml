<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1870" viewBox="0 0 1920 1870" role="img" aria-labelledby="title desc">
<title id="title">经济金融机器学习：课件关系图</title>
<desc id="desc">十一份课件。上层从导论到 AI 底座与提示词、CLAUDE 规则与任务规划、Skill 与子代理。下层第四讲依次学习 Notebook 与 DataFrame 入门、数据规范与 GitHub 协作、清洗连接与样本检查、变量统计与结果交付、面板与时间对齐。金色箭头表示学习顺序，青绿色箭头表示 04-3 的同一企业横截面表交给 04-4。04-5 另用年度模拟数据及日度、财报案例。第三层为 05-1 因子与因子模型理论基础及 05-2 量化投资导论；05-1 使用美国 FF3 与动量真实月度数据。</desc>
<defs>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#3E2028" flood-opacity="0.035"/></filter>
  <marker id="arrow-gold" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 2 2 L 8 6 L 2 10" fill="none" stroke="#D4B48C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-teal" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 2 2 L 8 6 L 2 10" fill="none" stroke="#35665F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; } .heading { fill: #3E2028; font-weight: 600; } .muted { fill: #76675D; } .teal { fill: #35665F; }</style>
</defs>
