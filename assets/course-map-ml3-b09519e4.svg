<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="3130" viewBox="0 0 1920 3130" role="img" aria-labelledby="title desc">
<title id="title">经济金融机器学习：课件关系图</title>
<desc id="desc">十五份课件。上层从导论到 AI 底座与提示词、CLAUDE 规则与任务规划、Skill 与子代理。下层第四讲依次学习 Notebook 与 DataFrame 入门、数据规范与 GitHub 协作、清洗连接与样本检查、变量统计与结果交付、面板与时间对齐。金色箭头表示学习顺序，青绿色箭头表示 04-3 的同一企业横截面表交给 04-4。04-5 另用年度模拟数据及日度、财报案例。第三层依次为 05-1 因子与因子模型理论基础、05-2 量化投资导论、05-3 因子评估、组合回测与机器学习入口；05-1 使用美国 FF3 与动量真实月度数据。第四层为已发布的 ML1 线性模型与惩罚回归：承接第五讲股票面板、收益标签和时间边界，加入动量、波动率与相对成交量，与EP形成7个中性化信号；用训练损失估计系数、验证MSE选择参数、RMSE与Rank IC评价预测。ML2 用模拟财务特征学习降维。ML3 介绍 K 近邻与决策树，用银行营销数据学习分类与联系阈值，用课程正盈利股票面板预测收益并比较模型。</desc>
