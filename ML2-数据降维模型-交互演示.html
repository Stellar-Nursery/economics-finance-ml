function line(x,y,X,Y,color=axis,width=1,dash=""){
  return '<line x1="'+x+'" y1="'+y+'" x2="'+X+'" y2="'+Y+'" stroke="'+color+'" stroke-width="'+width+'" stroke-dasharray="'+dash+'"/>';
}
function dot(x,y,color=green,r=2.4){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+color+'" opacity=".78"/>'}
function label(x,y,s,anchor="middle"){return '<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'">'+s+'</text>'}
function scatter(points,cx,caption,angle,project){
  const cy=99,scale=19,cs=Math.cos(angle),sn=Math.sin(angle);
  let out=line(cx-105,cy,cx+105,cy)+line(cx,cy-91,cx,cy+91);
  for(const [x,y] of points){
    const d=x*cs+y*sn;
    out+=dot(cx+scale*(project?d*cs:x),cy-scale*(project?d*sn:y));
  }
  return out+line(cx-88*cs,cy+88*sn,cx+88*cs,cy-88*sn,red,2)+label(cx,205,caption);
}
function curves(series,low,high,pick,threshold){
  const n=series[0].values.length,L=112,R=820,T=14,B=165;
  const x=i=>L+i*(R-L)/(n-1), y=v=>B-(v-low)*(B-T)/(high-low);
  let out="";
  for(let j=0;j<=4;j++){
    const v=low+(high-low)*j/4;
    out+=line(L,y(v),R,y(v),"#ded4c4")+label(L-12,y(v)+5,v.toFixed(2),"end");
  }
  out+=line(x(pick),T,x(pick),B,gold,1.5,"4 3");
  if(threshold!==undefined) out+=line(L,y(threshold),R,y(threshold),gold,1.5,"5 4");
  for(let i=0;i<n;i++) out+=label(x(i),186,i+1);
  series.forEach(({values,color,name},j)=>{
    const pts=values.map((v,i)=>x(i)+","+y(v)).join(" ");
    out+='<polyline fill="none" stroke="'+color+'" stroke-width="3" points="'+pts+'"/>';
    out+=dot(x(pick),y(values[pick]),color,5)+line(837,28+26*j,858,28+26*j,color,3)+label(865,34+26*j,name,"start");
  });
  return out+label(464,211,"成分个数");
}
function principalAngle(points){
  let xx=0,xy=0,yy=0;
  for(const [x,y] of points){xx+=x*x;xy+=x*y;yy+=y*y}
  return Math.atan2(2*xy,xx-yy)/2;
}
function draw(){
  const v=Number(slider.value);
  let plot,readout;
  if(current===0){
    const a=v*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    let along=0,total=0;
    for(const [x,y] of data.scaled){along+=(x*c+y*s)**2;total+=x*x+y*y}
    plot=scatter(data.scaled,285,"标准化特征与投影方向",a,false)+scatter(data.scaled,665,"沿该方向的正交投影",a,true);
    readout=v+"°　保留方差 "+(100*along/total).toFixed(1)+"%";
  }else if(current===1){
    const k=data.cumulative.findIndex(value=>value>=v/100);
    plot=curves([{values:data.cumulative,color:green,name:"累计占比"}],0,1,k,v/100);
    readout=v+"%　至少需 "+(k+1)+" 个成分，累计占比 "+(100*data.cumulative[k]).toFixed(1)+"%";
  }else if(current===2){
    plot=curves([{values:data.mean_cv,color:green,name:"验证 R²"}],Math.floor(Math.min(...data.mean_cv)*10)/10,1,v-1);
    readout=v+" 个成分　五折平均验证 R² = "+data.mean_cv[v-1].toFixed(3);
  }else if(current===3){
    const weighted=data.A.map(([x,y])=>[x*data.gamma[0],y*data.gamma[1]]);
    const shown=v===1?weighted:data.A;
    plot=scatter(data.A,285,"加权前 · 第一主成分方向",principalAngle(data.A),false)+scatter(shown,665,(v===1?"加权后":"加权前")+" · 第一主成分方向",principalAngle(shown),false);
    readout=v===1?"加权后　两列分别乘以 "+data.gamma.map(x=>x.toFixed(2)).join(" 和 "):"加权前　两列保留原尺度";
  }else{
    const low=Math.min(...data.pcr_scores,...data.pls_scores);
    plot=curves([{values:data.pcr_scores,color:green,name:"PCR"},{values:data.pls_scores,color:red,name:"PLS"}],Math.min(0,Math.floor(low*10)/10),1,v-1);
    readout=v+" 个成分　测试 R²：PCR "+data.pcr_scores[v-1].toFixed(3)+"，PLS "+data.pls_scores[v-1].toFixed(3);
  }
  result.value=readout;
  svg.innerHTML='<title id="chart-title">'+experiments[current][0]+'，'+readout+'</title>'+plot;
}
function select(){
  current=experiments.findIndex((_,i)=>hash(i)===location.hash);
  if(current<0) current=0;
  const [title,control,min,max,initial]=experiments[current];
  document.querySelector("h1").textContent=tag(current)+"　"+title;
  document.querySelector("label").textContent=control;
  slider.min=min;slider.max=max;slider.value=initial;
  Array.from(nav.children).forEach((a,i)=>{if(i===current)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  draw();
}
slider.addEventListener("input",draw);window.addEventListener("hashchange",select);select();
</script></html>
