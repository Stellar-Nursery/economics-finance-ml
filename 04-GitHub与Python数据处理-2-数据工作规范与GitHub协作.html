section { width:1280px; height:720px; box-sizing:border-box; background:var(--cream); color:var(--ink); font-family:&quot;Avenir Next&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif; font-size:28px; line-height:1.5; padding:44px 64px 66px; display:block; align-content:start; position:relative; }
section::before { content:&quot;&quot;; position:absolute; left:64px; right:64px; top:29px; height:2px; background:var(--gold); }
section::after { content:attr(data-marpit-pagination) &quot;/&quot; attr(data-marpit-pagination-total); right:48px; bottom:19px; color:var(--muted); font-size:16px; font-family:&quot;Avenir Next&quot;,sans-serif; }
h1 { color:var(--ink); font-family:&quot;Songti SC&quot;,&quot;STSong&quot;,serif; font-size:46px; line-height:1.2; letter-spacing:.01em; margin:13px 0 25px; font-weight:800; }
h2 { color:var(--teal); font-size:31px; margin:0 0 16px; font-weight:650; }
p { margin:0 0 15px; }
strong,b { font-weight:650; }
a { color:var(--teal); text-decoration:underline; text-underline-offset:4px; }
.eyebrow { font-size:18px; letter-spacing:.13em; color:var(--muted); margin-top:0; }
.eyebrow span { float:right; letter-spacing:.05em; }
.lead { font-size:29px; margin-bottom:12px; }
figure { margin:5px 0 12px; width:1120px; height:300px; }
figure img { width:1120px; height:300px; object-fit:contain; }
.takeaway { border-left:4px solid var(--gold); padding:10px 0 10px 20px; margin-top:22px; font-size:28px; line-height:1.45; }
.rows { margin:16px 0; }
.row { display:grid; grid-template-columns:230px 1fr; gap:22px; border-top:1px solid #d9cbb6; padding:16px 0; align-items:start; }
.row:last-child { border-bottom:1px solid #d9cbb6; }
.row b { color:var(--teal); }
.columns { display:grid; grid-template-columns:1fr 1fr; gap:60px; margin:36px 0 24px; }
.columns&gt;div+div { border-left:1px solid var(--gold); padding-left:40px; }
.columns p { line-height:1.85; }
section table { display:table; width:100%; border-collapse:collapse; margin:22px 0; font-size:28px; }
section table th { text-align:left; font-weight:650; color:var(--teal); border-top:2px solid var(--ink); border-bottom:1px solid var(--gold); background:transparent; }
section table th, section table td { padding:15px 16px; border-left:0; border-right:0; }
section table tr { border:0; background:transparent; }
section table td { border-bottom:1px solid #d9cbb6; }
section table tr:nth-child(2n) { background:#f4eddd; }
section table tr:first-child { background:transparent; }
.quote { font-family:&quot;Songti SC&quot;,serif; font-size:52px; line-height:1.55; margin:26px 0; font-weight:600; }
.quote.medium { font-size:48px; margin:18px 0 22px; }
.big-thesis { font-family:&quot;Songti SC&quot;,serif; font-size:48px; line-height:1.5; margin:26px 0 34px; }
.ladder { margin:40px 0 30px; }
.ladder&gt;div { display:flex; align-items:center; gap:32px; padding:20px 0; border-bottom:1px solid #d9cbb6; }
.ladder em { font-style:normal; font-family:Georgia,serif; color:var(--gold); font-size:40px; }
.ladder b { width:200px; }
.word-flow,.course-route { display:flex; align-items:center; justify-content:space-between; padding:26px 18px; margin:28px 0; border-top:2px solid var(--gold); border-bottom:2px solid var(--gold); font-size:31px; }
.word-flow i,.course-route i { color:var(--teal); font-style:normal; }
.prompt { padding:20px 26px; font-size:34px; }
.prompt.weak { color:var(--muted); border-left:3px solid #c8bdad; margin-top:38px; }
.prompt.strong { color:var(--teal); border-left:3px solid var(--teal); font-weight:600; line-height:1.7; }
.report { border-left:3px solid var(--gold); padding:10px 22px; margin:0 0 18px; }
.report .label { font-size:18px; color:var(--muted); }
.report p { font-family:&quot;Songti SC&quot;,serif; font-size:32px; margin:10px 0 0; }
.code-intent { display:flex; gap:32px; padding:18px 0; }
.code-intent b { color:var(--teal); }
pre { background:#eee7d7; border:1px solid #d7c7b0; padding:22px 28px; margin:20px 0; line-height:1.65; border-radius:0; }
section.dirtree pre { margin:6px 0 2px; padding:10px 28px; line-height:1.36; }
section.dirtree pre code { font-size:28px; line-height:1.36; }
section.dirtree .takeaway { margin-top:10px; }
code { font-family:&quot;SFMono-Regular&quot;,Menlo,Consolas,monospace; font-size:28px; background:transparent; color:var(--ink); }
pre code { font-size:28px; }
.exercise-story { border-left:4px solid var(--gold); padding:16px 26px; margin:18px 0 30px; }
.exercise-story b { color:var(--teal); }
.exercise-story p { line-height:1.8; margin:12px 0 0; font-size:30px; }
.exercise-bottom { display:flex; gap:42px; align-items:center; }
.timer { font:80px Georgia,serif; color:var(--teal); }
.timer span { font:24px &quot;PingFang SC&quot;,sans-serif; padding-left:10px; }
section.cover { background:var(--ink); color:var(--cream); padding-top:54px; }

;" data-marpit-pagination-total="38" data-size="16:9"><div class="eyebrow">规范与协作——六项标准<span>经济金融机器学习</span></div>
<h1 id="%E5%85%AD%E9%A1%B9%E6%A0%87%E5%87%86%E6%80%8E%E6%A0%B7%E5%88%A4%E6%96%AD%E6%95%B0%E6%8D%AE%E6%98%AF%E5%90%A6%E5%8F%AF%E4%BF%A1">六项标准：怎样判断数据是否可信</h1>
<div class="columns"><div><ul><li><b>口径明确</b><br />每行代表什么？明确期间、键、变量含义与单位。</li><li><b>原始保护</b><br />原件能否复查？记录来源，只读原件，结果另存。</li><li><b>命名规范</b><br />名称是否一致？规范文件与变量名，记录映射并更新字典。</li></ul></div><div><ul><li><b>变换受控</b><br />为什么这样改？检查类型、缺失、重复、连接与时间。</li><li><b>过程可复现</b><br />能否从头重做？保留输入版本、依赖、参数与运行顺序。</li><li><b>结果可核验</b><br />凭什么相信结果？核对行数、有效数、匹配、合计与抽查。</li></ul></div></div>
<p>细则见<a href="index.html#materials">《数据处理与分析工作准则》</a>。每个处理步骤都要用六项标准检查。</p>
